  <style>

    body { background:#050508; color:#f5f0ff; font-family:ui-monospace, Menlo, monospace; font-size:18px; margin:0; }

    .gl-entry .nv-hover-neon {position:relative;cursor:pointer;transition:transform .35s ease, box-shadow .35s ease;}
    .gl-entry figure:has(> img.nv-hover-neon) {position:relative;overflow:visible;}
    .gl-entry img.nv-hover-neon:hover {transform:scale(1.03);box-shadow:0 0 0 2px #e58ac2,0 0 28px rgba(230,138,194,.9),0 0 60px rgba(139,92,246,.7);}
    .gl-entry img.nv-hover-neon:hover::after {content:"";}
    .gl-entry figure:has(> img.nv-hover-neon):hover::after {content:"";position:absolute;inset:-14px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0deg,rgba(230,138,194,.85) 40deg,transparent 90deg,rgba(139,92,246,.85) 180deg,transparent 250deg,rgba(0,229,255,.8) 310deg,transparent 360deg);
  -webkit-mask:radial-gradient(closest-side,transparent 58%,#000 60%,#000 72%,transparent 74%);
  mask:radial-gradient(closest-side,transparent 58%,#000 60%,#000 72%,transparent 74%);
  animation:nv-swirl 6s linear infinite;}
    .gl-entry to {transform:rotate(360deg);}
    .gl-entry body.nv-astral-on::before {content:"";position:fixed;inset:-20%;z-index:40;pointer-events:none;mix-blend-mode:screen;opacity:.5;
  background:
    radial-gradient(circle at 30% 30%,rgba(230,138,194,.55) 0,transparent 34%),
    radial-gradient(circle at 70% 60%,rgba(139,92,246,.55) 0,transparent 38%),
    radial-gradient(circle at 50% 80%,rgba(0,229,255,.4) 0,transparent 30%);
  animation:nv-astral-drift 9s ease-in-out infinite alternate;}
    .gl-entry from {transform:rotate(-6deg) scale(1);}
    .gl-entry to {transform:rotate(6deg) scale(1.08);}

    /* Entry popup + pixel thumbnails (Nov 22, 2026): entries open in a
       glass overlay over the index — the index stays mounted behind it,
       so the reader's place (scroll, search) is kept. Layer: above the
       page content and ticker (z 4), below the shell back button and

    ul.gl-entries a { display:inline-flex; align-items:center; gap:8px; }

<body>
  <canvas id="gl-webgpu" aria-hidden="true"></canvas>
  <canvas id="gl-bg" aria-hidden="true"></canvas>
  <script src="../config.js"></script>
  <main>
    <div class="card">
      <h1>GRID LOG</h1>
      <p class="gl-sub">The Neon Vigil encyclopedia. The Web Bible lives here now — every entry, in wiki form. The Bible in the Master Codex drive stays the source of truth underneath.</p>
      <div class="gl-searchwrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21"/></svg><input id="gl-search" class="gl-search" type="search" placeholder="Search the Log…" autocomplete="off"></div>
    </div>
    <div id="gl-root" aria-busy="true"><div class="card"><p class="gl-loading nv-loader-shimmer" role="status" aria-label="Loading">LOADING THE LOG…</p></div></div>
    <div class="nv-state" id="glEmptyState" hidden><p class="nv-state-title">Not Found</p><p class="nv-state-line">No entries match your search.</p><p><button type="button" class="nv-btn" id="glClearSearch">Clear search</button></p></div>
    <div class="card"><p class="gl-note"><a href="/hub.html">Back to hub</a> · Grid Log — a part of Hex OS.</p></div>
  </main>
  <div class="gl-pop-backdrop" id="glPopBackdrop" hidden>
    <div class="gl-pop-panel" role="dialog" aria-modal="true" aria-label="" id="glPopPanel">
      <div class="gl-pop-head">
        <h2 class="gl-pop-title" id="glPopTitle" tabindex="-1"></h2>
        <button type="button" class="gl-pop-close" id="glPopClose" aria-label="Back" title="Back (Esc)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 3.5h7v17h-7"/><g class="nv-back-glyph-arrow"><path d="M16.5 12H4"/><path d="M9.5 5.5 3.5 12l6 6.5"/></g></svg></button>
      </div>
      <div class="gl-pop-body" id="glPopBody"></div>
    </div>
  </div>
  <script src="bible-data.js"></script>
  <script>
  (function(){
    var D = window.NEON_BIBLE_DATA;
    var root = document.getElementById('gl-root');
    var search = document.getElementById('gl-search');
    var emptyState = document.getElementById('glEmptyState');
    var glAnnounced = false;
    function glLoaded(){
      root.setAttribute('aria-busy', 'false');
      if(!glAnnounced){ glAnnounced = true; if(window.NVAnnounce) NVAnnounce('Loaded'); }
    }
    var clearBtn = document.getElementById('glClearSearch');
    if(clearBtn) clearBtn.addEventListener('click', function(){ search.value = ''; renderIndex(''); search.focus(); });
    /* Error states (Nov 22, 2026): data missing or empty is a
       page-level failure — the shared error panel with a Reload
       action, not a bare line. The normal path below is untouched. */
    if(!D || !D.entries || !D.entries.length){
      root.innerHTML = '<div class="nv-state nv-state-error"><p class="nv-state-title">Something went wrong</p><p class="nv-state-line">The Grid Log couldn\'t load its entries.</p><p><button type="button" class="nv-btn" id="glReloadBtn">Reload</button></p></div>';
      root.setAttribute('aria-busy', 'false');
      var reloadBtn = document.getElementById('glReloadBtn');
      if(reloadBtn) reloadBtn.addEventListener('click', function(){ location.reload(); });
      return;
    }
    var byId = {}; D.entries.forEach(function(e){ byId[e.id]=e; });
    function secKey(name, i){
      if(/^cover$/i.test(name)) return -1;
      var m = name.match(/^(\d+)\s/); if(m) return parseInt(m[1],10);
      return 100 + i;
    }
    var sections = D.sections.map(function(s,i){ return {name:s.name, ids:s.entry_ids||[], k:secKey(s.name,i)}; })
      .sort(function(a,b){ return a.k-b.k; });
    function esc(s){ return s.replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
    /* GIF-led character cards (User's ruling Nov 20, 2026, on merge Flag 2;
       Nov 9 Grid Log rule): a character's canon GIF leads where one exists,
       the canon portrait stands where no GIF exists. */
    function primFor(name){
      if(/personae/i.test(name)) return ['hexa-sigil','xero-unit-x-07','xavier-unit-x-08','indigo','the-valkyrie-val-1-to-val-18','cyphr','neon','praxia','kael-voss','himhun','indigo-s-husband','nexus-01-x-10','zed-gar'];
      if(/crew/i.test(name)) return ['noor','alyha','star','cali-rose','jade-and-nikita-reserve-crew'];
      return null;
    }
    var CARDIMG = {
      'hexa-sigil': 'assets/hexa-animated-chatgpt.gif',
      'xero-unit-x-07': '/portraits/NV-Xero_Portrait.png',
      'xavier-unit-x-08': '/portraits/NV-Xavier_Portrait.png',
      'indigo': '/portraits/NV-Indigo_Portrait.png',
      'the-valkyrie-val-1-to-val-18': '/portraits/NV-Val17_Portrait.png',
      'cyphr': 'assets/cyphr-animated-chatgpt.gif',
      'neon': '/portraits/NV-Neon_Ultra_Suite_GIF_2026-11-09.gif',
      'praxia': '/portraits/NV-Praxia_Portrait.png',
      'himhun': '/portraits/NV-HimHun_Portrait.png',
      'nexus-01-x-10': '/portraits/NV-Nexus_Portrait.png',
      'noor': '/portraits/NV-Noor_Portrait.png',
      'alyha': '/portraits/NV-Alyha_Portrait.png',
      'star': '/portraits/NV-Star_Portrait.png',
      'cali-rose': '/portraits/NV-Cali_Rose_Portrait.png',
      'jade-and-nikita-reserve-crew': '/portraits/NV-Jade_Portrait.png'
    };
    function cardImg(e){
      if(CARDIMG[e.id]) return CARDIMG[e.id];
      var m = (e.html||'').match(/assets\/[A-Za-z0-9._-]+\.(?:jpg|gif|png)/);
      return m ? m[0] : '';
    }
    /* Pixel thumbnails (Nov 22, 2026): every dossier row carries a small
       pixel image of its topic — the same source the cards resolve
       (cardImg above), drawn cover-cropped into a 12x12 canvas displayed
       at 36px with image-rendering:pixelated. No new assets. Entries
       with no image anywhere get a deterministic pixel-block placeholder
       hashed from the entry id (sigil palette, mirrored block field) —
       a visible pattern, not fake art. Pixelation is lazy: a canvas is
       only painted when it scrolls near the viewport. */
    var SIGIL_PIX = ['#6366f1','#22d3ee','#f471b5','#22c55e','#facc15','#8b8dff'];
    function thumbHTML(e){
      var src = cardImg(e);
      return '<canvas class="gl-thumb" width="12" height="12" data-glid="' + e.id + '"' + (src ? ' data-src="' + src + '"' : '') + ' aria-hidden="true"></canvas>';
    }
    function pixSeed(str){ var h = 2166136261; for(var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
    function pixRand(seed){ var t = seed >>> 0; return function(){ t = (t + 0x6D2B79F5) >>> 0; var r = Math.imul(t ^ (t >>> 15), 1 | t); r ^= r + Math.imul(r ^ (r >>> 7), 61 | r); return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
    function paintPlaceholder(cv, id){
      var ctx = cv.getContext('2d'); if(!ctx) return;
      var rnd = pixRand(pixSeed(id || ''));
      var c1 = SIGIL_PIX[Math.floor(rnd() * SIGIL_PIX.length)];
      var c2 = SIGIL_PIX[Math.floor(rnd() * SIGIL_PIX.length)];
      ctx.fillStyle = '#0a0616'; ctx.fillRect(0,0,12,12);
      for(var y=0;y<6;y++){ for(var x=0;x<6;x++){
        var r = rnd(); if(r < 0.42) continue;
        ctx.fillStyle = r < 0.78 ? c1 : c2;
        ctx.fillRect(x*2, y*2, 2, 2);
        ctx.fillRect(10 - x*2, y*2, 2, 2);
      } }
    }
    function pixelate(cv){
      if(cv.getAttribute('data-done')) return;
      cv.setAttribute('data-done', '1');
      var src = cv.getAttribute('data-src'), id = cv.getAttribute('data-glid');
      if(!src){ paintPlaceholder(cv, id); return; }
      var img = new Image();
      img.onload = function(){
        var ctx = cv.getContext('2d'); if(!ctx) return;
        var s = Math.max(12 / img.width, 12 / img.height), dw = img.width * s, dh = img.height * s;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, (12 - dw) / 2, (12 - dh) / 2, dw, dh);
      };
      img.onerror = function(){ paintPlaceholder(cv, id); };
      img.src = src;
    }
    var thumbObserver = ('IntersectionObserver' in window) ? new IntersectionObserver(function(list){
      list.forEach(function(en){ if(en.isIntersecting){ thumbObserver.unobserve(en.target); pixelate(en.target); } });
    }, { rootMargin: '120px' }) : null;
    function paintThumbs(){
      var list = root.querySelectorAll('canvas.gl-thumb');
      for(var i=0;i<list.length;i++){ if(thumbObserver) thumbObserver.observe(list[i]); else pixelate(list[i]); }
    }
    function renderIndex(filter){
      var f = (filter||'').toLowerCase(), html = '', ci = 0;
      sections.forEach(function(s){
        var items = s.ids.map(function(id){ return byId[id]; }).filter(Boolean)
          .filter(function(e){ return !f || e.title.toLowerCase().indexOf(f) > -1; });
        if(!items.length) return;
        html += '<div class="card" style="animation-delay:' + (ci++ * 45) + 'ms"><h2 class="gl-sec">' + esc(s.name) + '</h2>';
        var prim = primFor(s.name);
        if(prim){
          var inGrid = {};
          html += '<div class="gl-grid">';
          prim.forEach(function(id){
            var e = byId[id]; if(!e) return;
            if(f && e.title.toLowerCase().indexOf(f) === -1) return;
            inGrid[id] = 1;
            var img = cardImg(e);
            html += '<a class="gl-pcard" style="animation-delay:' + (ci++ * 45) + 'ms" href="#/e/' + e.id + '">'
              + (img ? '<img loading="lazy" src="' + img + '" alt="' + esc(e.title) + '">' : '')
              + '<span class="gl-pname">' + esc(e.title) + '</span>'
              + (e.classified ? '<span class="nv-state-stamp">CLASSIFIED</span><span class="nv-redacted">' + esc(e.kicker || e.title) + '</span>' : '')
              + '</a>';
          });
          html += '</div>';
          var rest = items.filter(function(e){ return !inGrid[e.id]; });
          if(rest.length){
            html += '<p class="gl-kicker gl-more">More in this section</p><ul class="gl-entries">';
            rest.forEach(function(e){ html += '<li><a href="#/e/' + e.id + '">' + thumbHTML(e) + esc(e.title) + '</a>' + (e.classified ? ' <span class="nv-state-stamp">CLASSIFIED</span>' : '') + '</li>'; });
            html += '</ul>';
          }
        } else {
          html += '<ul class="gl-entries">';
          items.forEach(function(e){ html += '<li><a href="#/e/' + e.id + '">' + thumbHTML(e) + esc(e.title) + '</a>' + (e.classified ? ' <span class="nv-state-stamp">CLASSIFIED</span>' : '') + '</li>'; });
          html += '</ul>';
        }
        html += '</div>';
      });
      root.innerHTML = html;
      indexInRoot = true;
      paintThumbs();
      if(emptyState) emptyState.hidden = !!html;
      glLoaded();
    }
    function neighbors(id){
      var flat = []; sections.forEach(function(s){ s.ids.forEach(function(x){ if(byId[x]) flat.push(x); }); });
      var i = flat.indexOf(id);
      return { prev: i>0 ? flat[i-1] : null, next: i>=0 && i<flat.length-1 ? flat[i+1] : null };
    }
    /* Entry popup (Nov 22, 2026): entries render INSIDE a glass overlay
       over the index instead of replacing it. entryParts() returns the
       same content the old full-page entry view built — section kicker,
       the .gl-entry body (vestigial tabbar stripped), prev/next nav,
       and the Classified / Not Found states unchanged — only the chrome
       differs: the panel header carries the title and the back-icon
       close button, and the panel body scrolls instead of the window.
       No entry content changed. */
    function navHTML(n){
      return '<div class="gl-nav"><span>' + (n.prev ? '<a href="#/e/' + n.prev + '">&larr; ' + esc(byId[n.prev].title) + '</a>' : '') + '</span>'
        + '<span>' + (n.next ? '<a href="#/e/' + n.next + '">' + esc(byId[n.next].title) + ' &rarr;</a>' : '') + '</span></div>';
    }
    function entryParts(id){
      var e = byId[id];
      if(!e){
        return { title: 'Not Found', body: '<div class="nv-state"><p class="nv-state-title">Not Found</p><p class="nv-state-line">That entry isn\'t in the Grid Log.</p><p><a class="nv-btn" href="#/">Grid Log index</a></p></div>' };
      }
      if(e.classified){
        return { title: e.title, body: '<p class="gl-kicker">' + esc(e.section || '') + '</p>'
          + '<div class="nv-state"><p><span class="nv-state-stamp">CLASSIFIED</span></p><p class="nv-state-title">' + esc(e.title) + '</p><p class="nv-state-line">This entry is classified.</p></div>'
          + navHTML(neighbors(id)) };
      }
      var html = e.html.replace(/<div class="tabbar">[\s\S]*?<\/div>/, '');
      return { title: e.title, body: '<p class="gl-kicker">' + esc(e.section || '') + '</p>'
        + '<div class="gl-entry">' + html + '</div>' + navHTML(neighbors(id)) };
    }
    var backdrop = document.getElementById('glPopBackdrop');
    var panel = document.getElementById('glPopPanel');
    var popTitle = document.getElementById('glPopTitle');
    var popBody = document.getElementById('glPopBody');
    var popClose = document.getElementById('glPopClose');
    var popupOpen = false, popupId = null, indexInRoot = false, lastOpener = null, savedScroll = 0;
    function showPopup(id){
      var parts = entryParts(id);
      if(!popupOpen) savedScroll = window.scrollY;
      popupOpen = true; popupId = id;
      popTitle.textContent = parts.title;
      panel.setAttribute('aria-label', parts.title);
      popBody.innerHTML = parts.body;
      popBody.scrollTop = 0;
      if(backdrop.hidden){
        backdrop.hidden = false;
        document.body.style.overflow = 'hidden';
      }
      if(!panel.contains(document.activeElement)) popTitle.focus();
      if(window.NVAnnounce) NVAnnounce(parts.title);
      if(emptyState) emptyState.hidden = true;
      glLoaded();
    }
    function hidePopup(){
      if(!popupOpen) return;
      var id = popupId;
      popupOpen = false; popupId = null;
      backdrop.hidden = true;
      document.body.style.overflow = '';
      /* The index re-renders on the close route (same as before this
         pass), so the opener node may have been replaced — fall back to
         the fresh link for the same entry. Scroll returns to the exact
         offset saved when the popup opened. */
      var target = (lastOpener && document.contains(lastOpener)) ? lastOpener
        : (id ? root.querySelector('a[href="#/e/' + id + '"]') : null);
      if(target) target.focus();
      window.scrollTo(0, savedScroll);
    }
    function requestClose(){
      if(/^#\/e\//.test(location.hash || '')) location.hash = '#/';
      else hidePopup();
    }
    popClose.addEventListener('click', requestClose);
    backdrop.addEventListener('click', function(e){ if(e.target === backdrop) requestClose(); });
    document.addEventListener('click', function(e){
      var t = e.target;
      var a = (t && t.closest) ? t.closest('a[href^="#/e/"]') : null;
      if(a && root.contains(a)) lastOpener = a;
    });
    /* Escape closes the popup — and ONLY the popup. This listener runs
       in the CAPTURE phase and stops the event while the popup is open,
       so the shell's document-level Escape handler (bubble phase,
       nv-shell.js) never receives it and cannot fire history
       navigation. Backstop: the overlay's class contains "backdrop",
       which the shell's own visible-layer check also yields to. While
       the popup is closed this listener does nothing at all, so the
       shell's Escape behavior is untouched. If the Commands palette is
       open above the popup, the palette owns Escape first. */
    document.addEventListener('keydown', function(e){
      if(e.key !== 'Escape' || !popupOpen) return;
      var ov = document.querySelector('.palette-overlay');
      if(ov && ov.classList.contains('open')) return;
      e.stopPropagation();
      e.preventDefault();
      requestClose();
    }, true);
    function route(){
      var h = location.hash || '#/';
      var m = h.match(/^#\/e\/(.+)$/);
      if(m){
        if(!indexInRoot) renderIndex(search.value);
        showPopup(decodeURIComponent(m[1]));
      } else {
        renderIndex(search.value);
        hidePopup();
      }
    }
    window.addEventListener('hashchange', route);
    search.addEventListener('input', function(){ if((location.hash||'#/') === '#/') renderIndex(search.value); });
    route();
    /* Light 2D tier — runs ONLY as the fallback when the WebGPU module
       (gl-bg.js) is unavailable or fails; the module calls __glFallback. */
    var bgStarted = false;
    window.__glFallback = function(){ if(!bgStarted){ bgStarted = true; startBg2d(); } };
    setTimeout(function(){ if(!bgStarted && !(window.__glStarted && window.__glStarted())) window.__glFallback(); }, 8000);
    function startBg2d(){
    document.getElementById('gl-bg').classList.add('on');
    var cv = document.getElementById('gl-bg'), ctx = cv.getContext('2d'), W, H, P = [], still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function size(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
    size(); addEventListener('resize', size);
    var accent = getComputedStyle(document.documentElement).getPropertyValue('--nv-accent').trim() || '#6366f1';
    for(var i=0;i<70;i++) P.push({x:Math.random(), y:Math.random(), s:Math.random()*1.8+0.4, v:Math.random()*0.00035+0.00008});
    function tick(){
      ctx.clearRect(0,0,W,H); ctx.fillStyle = accent;
      P.forEach(function(p){ p.y -= p.v; if(p.y < -0.02){ p.y = 1.02; p.x = Math.random(); }
        ctx.globalAlpha = 0.35; ctx.fillRect(p.x*W, p.y*H, p.s, p.s); });
      ctx.globalAlpha = 1;
      if(!still && !document.hidden) requestAnimationFrame(tick);
    }
    tick();
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick(); });
    }
  })();
  </script>
  <script type="module" src="gl-bg.js"></script>
  <script src="../auth.js"></script>
  <script src="../nv-ticker.js"></script>
  <script src="../nv-commands.js"></script>
  <script src="../nv-shell.js"></script>
  <script src="../nv-sprite.js"></script>
